<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Lolita Closet - 新規ユーザー登録</title>
    <style>
        body { font-family: 'Meiryo UI', sans-serif; background-color: #fcfcfc; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; height: 100vh; color: #333; }
        
        /* 🏰 ログイン画面と統一感を持たせた、上品な白のカードボックス */
        .register-container { background: white; border: 2px solid #e0cfeb; border-radius: 12px; width: 100%; max-width: 400px; padding: 40px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(31, 73, 125, 0.06); text-align: center; }
        
        .logo-area { font-size: 24px; font-weight: bold; color: #1f497d; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .sub-title { font-size: 13px; color: #666; margin-bottom: 30px; letter-spacing: 0.5px; }
        
        /* 💌 入力フォームのデザイン */
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-label { font-size: 12px; font-weight: bold; color: #1f497d; display: block; margin-bottom: 6px; }
        .form-input { width: 100%; padding: 12px 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
        .form-input:focus { border-color: #1f497d; outline: none; box-shadow: 0 0 5px rgba(31, 73, 125, 0.1); }
        
        /* 🎀 ボタン */
        .btn-register { width: 100%; padding: 12px; background-color: #1f497d; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background-color 0.2s; }
        .btn-register:hover { background-color: #143256; }
        
        /* 🔗 下部のナビゲーションリンク */
        .nav-link { font-size: 13px; color: #1f497d; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 25px; border-bottom: 1px dashed #1f497d; padding-bottom: 2px; }
        .nav-link:hover { color: #143256; border-bottom-style: solid; }
        
        /* ⚠️ 警告・メッセージエリア */
        .alert { padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 20px; text-align: left; line-height: 1.5; background-color: #fdf2f2; border: 1px solid #f8b4b4; color: #9b1c1c; }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="logo-area">🏰 My Lolita Closet</div>
        <div class="sub-title">新しくお嬢様（お坊ちゃま）のクローゼットを開設します</div>

        <!-- ⚠️ ユーザー名が重複していた場合に、Java側から届いたエラーメッセージを可愛く表示 -->
        <div th:if="${error}" class="alert" th:text="${error}">
            エラーメッセージがここに表示されます。
        </div>

        <!-- 💌 新規ユーザー登録フォーム -->
        <form th:action="@{/register}" method="post">
            
            <!-- ユーザー名入力欄 -->
            <div class="form-group">
                <label for="username" class="form-label">ご希望のユーザー名</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="例: alice_closet" required autofocus>
            </div>
            
            <!-- パスワード入力欄 -->
            <div class="form-group">
                <label for="password" class="form-label">パスワード</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>
            
            <!-- 新規登録実行ボタン -->
            <button type="submit" class="btn-register">クローゼットを開設する 🎀</button>
            
        </form>
        
        <!-- ログイン画面へ戻る優しい動線 -->
        <a th:href="@{/login}" class="nav-link">すでにアカウントをお持ちの方はこちら 🏰</a>
        
    </div>
</body>
</html>
